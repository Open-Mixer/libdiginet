name: ci
# Run by workflow_dispatch: on a pull request's head before it is merged (gh workflow run ci.yml --ref <branch>),
# and on demand. The fast checks, and make test on one runner, run on every pull request from public-sources.yml
# (the trigger gate allows that one workflow a pull_request trigger).
on:
  workflow_dispatch:
concurrency:
  # Every dispatch has a group of its own (the run id) and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: build + test (${{ matrix.image }})
    runs-on: ubuntu-latest
    # A backstop only: every test carries its own timeout (tests/run-test.sh).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils python3-pyyaml
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates python3-yaml
          fi
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: The shared checks the workflow tests render (tests/test_workflow_cells.sh, arms D and E)
        uses: actions/checkout@v4
        with:
          repository: Open-Mixer/.github
          ref: openmixer-v1
          path: dotgithub
      - name: Build
        run: make
      - name: Unit tests
        # A SKIP is red here (tests/run-test.sh), except test_packet, test_anyif and test_emu_child: they need
        # an unprivileged user+net namespace, which a container cannot make (the host job below runs them).
        run: make test OPENMIXER_DOTGITHUB="$PWD/dotgithub"
        env:
          DIGINET_TEST_SKIP_IS_FAIL: '1'
          DIGINET_TEST_SKIP_OK: 'test_packet test_anyif test_emu_child'
      - name: Install, and build a consumer against the installed tree
        run: |
          make install PREFIX=/usr DESTDIR="$PWD/stage"
          cat > consumer.c <<'EOF'
          #include <diginet/diginet.h>
          #include <diginet/transport/diginet_session.h>
          int main(void)
          {
                  struct diginet_session_config c;
                  diginet_session_config_default(&c);
                  return diginet_sum16((const unsigned char *)"\x01\x02", 2) == 3 && c.keepalive_ms == 10000 ? 0 : 1;
          }
          EOF
          PKG_CONFIG_SYSROOT_DIR="$PWD/stage" PKG_CONFIG_LIBDIR="$PWD/stage/usr/lib/pkgconfig" \
            sh -c 'cc consumer.c $(pkg-config --cflags --libs libdiginet-transport) -o consumer'
          ./consumer

  host:
    # The containers above usually cannot create user namespaces, so test_packet and test_anyif
    # report SKIP there. On the bare runner it can, once Ubuntu's AppArmor limit is lifted.
    name: make test on the runner (AF_PACKET in a namespace)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Open-Mixer/.github
          ref: openmixer-v1
          path: dotgithub
      - name: The Python YAML module the workflow tests read
        run: python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get -y install python3-yaml; }
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: make test
        run: make test OPENMIXER_DOTGITHUB="$PWD/dotgithub" 2>&1 | tee test.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
        env:
          DIGINET_TEST_SKIP_IS_FAIL: '1'
          # nothing may skip here: the runner can make the namespaces the three tests need
          DIGINET_TEST_SKIP_OK: none
      - name: The packet test ran
        run: "grep -q 'test_packet: ok' test.log"
      - name: The any-interface test ran (the helper's socket on veth pairs)
        run: "grep -q 'test_anyif: ok' test.log"

  ksy:
    name: diginet.ksy compiles and reads the golden frames
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:trixie
    steps:
      - name: Kaitai Struct compiler 0.11 and its Python runtime
        run: |
          apt-get update
          apt-get -y install --no-install-recommends default-jre-headless python3 python3-pip make curl ca-certificates
          curl -fsSL -o /tmp/ksc.deb https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler_0.11_all.deb
          apt-get -y install /tmp/ksc.deb
          pip install --break-system-packages kaitaistruct==0.11
      - uses: actions/checkout@v4
      - name: make ksy-check
        run: make ksy-check
