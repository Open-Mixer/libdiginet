name: release

# Packages through the shared release workflows of Open-Mixer/.github. A tag v<version> builds signed
# RPMs and DEBs in the cells the shared release-matrix action chooses (the quick set while a release
# wave is open, the whole matrix otherwise), publishes them to the OpenMixer channel and attaches them
# to the GitHub release. A dispatched run (workflow_dispatch) is a dry run: it builds and lints
# everything and publishes nothing.
#
# Either way, the packages the run built are then installed in clean containers of the same cells, and
# a consumer is built against the development package (tests/package-check.sh). The install checks ask
# release-matrix for their cells with the inputs the shared builds hand it, so they never ask for a cell
# the run did not build (0.1.10, run 43592063308). tests/test_workflow_cells.sh holds the rule.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  rpm:
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      package-name: libdiginet
      binary-names: libdiginet libdiginet-devel diginet-tools
      publish: ${{ github.ref_type == 'tag' }}
      needs-mod-host: false
      channel-deps: false
    secrets: inherit

  # or skipped RPM job skips this one, so no DEB is published after a failed RPM.
  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      package-name: libdiginet
      binary-names: libdiginet0 libdiginet-transport0 libdiginet-dev diginet-tools
      publish: ${{ github.ref_type == 'tag' }}
      dependencies: ''
      requires: ''
      channel-deps: false
    secrets: inherit

  # The cells the builds above made: release-matrix with the inputs build-rpm.yml / build-deb.yml hand it (this file
  # passes the builds no matrix, so their defaults), declared once here (Open-Mixer/.github#80).
  plan-rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - id: matrix
        uses: Open-Mixer/.github/.github/actions/release-matrix@openmixer-v1
        with:
          kind: rpm
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          releases: '["44", "45"]'
          arches: '["x86_64", "aarch64"]'

  plan-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - id: matrix
        uses: Open-Mixer/.github/.github/actions/release-matrix@openmixer-v1
        with:
          kind: deb
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          releases: '["bookworm", "trixie"]'
          arches: '["amd64", "arm64"]'

  install-rpm:
    name: Install check (fc${{ matrix.cell.fedora }}, ${{ matrix.cell.arch }})
    needs: [plan-rpm, rpm]
    if: needs.plan-rpm.outputs.count != '0'
    runs-on: ${{ matrix.cell.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    container: fedora:${{ matrix.cell.fedora }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan-rpm.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libdiginet-rpms-fc${{ matrix.cell.fedora }}-${{ matrix.cell.arch }}
          path: pkgs
      - name: Install in a clean fedora, build a consumer, check the capability
        run: sh tests/package-check.sh pkgs

  install-deb:
    name: Install check (${{ matrix.cell.suite }}, ${{ matrix.cell.arch }})
    needs: [plan-deb, deb]
    if: needs.plan-deb.outputs.count != '0'
    runs-on: ${{ matrix.cell.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    container: debian:${{ matrix.cell.suite }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan-deb.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libdiginet-debs-${{ matrix.cell.suite }}-${{ matrix.cell.arch }}
          path: pkgs
      # the shared workflow uploads each suite's .debs under a directory named after the suite
      - name: Install in a clean debian, build a consumer, check the capability
        run: sh tests/package-check.sh pkgs/${{ matrix.cell.suite }}
